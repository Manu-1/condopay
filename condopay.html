<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CondoPay VZLA - Demo Inversionista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes scan-line { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        .animate-scan-line { animation: scan-line 2.5s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icon Helper for Lucide
        const Icon = ({ name, size = 20, className = "", strokeWidth = 2 }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name, size, className, strokeWidth]);
            
            // Note: Use strokeWidth (camelCase) for React DOM elements
            return <i data-lucide={name} style={{ width: size, height: size }} className={className} strokeWidth={strokeWidth}></i>;
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [role, setRole] = useState(null);
            const [step, setStep] = useState('auth_welcome');
            const [selectedPayment, setSelectedPayment] = useState(null);
            const [selectedNotice, setSelectedNotice] = useState(null);

            const handleAccess = (selectedRole) => {
                if (selectedRole) setRole(selectedRole);
                setIsLoggedIn(true);
                setStep('dashboard');
            };

            const notices = [
                { id: 1, title: 'Mantenimiento de Bombas', date: '21/04', desc: 'Se realizará limpieza de tanques de 8:00 AM a 12:00 PM. Se recomienda tomar previsiones.', icon: 'info' },
                { id: 2, title: 'Fumigación Áreas Verdes', date: '25/04', desc: 'Se aplicará tratamiento contra insectos en el jardín y planta baja. Favor mantener mascotas dentro.', icon: 'shield-check' },
                { id: 3, title: 'Actualización de Seguridad', date: '01/05', desc: 'Nuevos tags de acceso vehicular disponibles en la administración. El sistema viejo se desactivará pronto.', icon: 'lock' }
            ];

            const receipts = [
                { id: 'RC-2024-03', month: 'Marzo 2024', amount: 'Bs. 2.100,00', date: '05/03/2024' },
                { id: 'RC-2024-02', month: 'Febrero 2024', amount: 'Bs. 1.950,00', date: '04/02/2024' },
                { id: 'RC-2024-01', month: 'Enero 2024', amount: 'Bs. 2.050,00', date: '10/01/2024' }
            ];

            // VISTAS
            const AuthWelcome = () => (
                <div className="flex flex-col h-full bg-white p-8 justify-center items-center">
                    <div className="bg-blue-900 p-6 rounded-[2.5rem] shadow-2xl mb-8">
                        <Icon name="building-2" size={64} className="text-white" />
                    </div>
                    <h1 className="text-3xl font-black text-slate-900 text-center mb-2 tracking-tighter italic">CondoPay VZLA</h1>
                    <p className="text-slate-500 text-center mb-12 text-sm">Fintech para comunidades eficientes.</p>
                    <div className="w-full space-y-4">
                        <button onClick={() => { setRole('inquilino'); setStep('login'); }} className="w-full bg-blue-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 active:scale-95 transition-all">
                            <Icon name="user" /> Soy Inquilino
                        </button>
                        <button onClick={() => { setRole('administrador'); setStep('login'); }} className="w-full bg-white border-2 border-slate-100 text-slate-700 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 active:scale-95 transition-all">
                            <Icon name="users" /> Soy Administrador
                        </button>
                    </div>
                </div>
            );

            const Login = () => (
                <div className="p-8 h-full bg-white flex flex-col">
                    <button onClick={() => setStep('auth_welcome')} className="mb-8 text-slate-400 font-bold text-xs uppercase tracking-widest self-start">← Volver</button>
                    <h2 className="text-2xl font-black text-slate-900 mb-2 tracking-tighter uppercase italic">Iniciar Sesión</h2>
                    <p className="text-slate-500 mb-8 text-sm italic">Perfil: {role}</p>
                    <div className="space-y-4 mb-8">
                        <input type="email" placeholder="Correo" className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none" />
                        <input type="password" placeholder="Contraseña" className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none" />
                    </div>
                    <button onClick={() => handleAccess()} className="w-full bg-blue-900 text-white py-4 rounded-2xl font-black shadow-xl mb-6 uppercase tracking-widest">Entrar</button>
                    <p className="text-center text-slate-400 text-xs">Demo: No requiere datos reales.</p>
                </div>
            );

            const InquilinoDashboard = () => (
                <div className="flex flex-col h-full bg-slate-50 pb-24 overflow-y-auto no-scrollbar">
                    <div className="bg-gradient-to-br from-blue-900 to-indigo-900 p-6 text-white rounded-b-[2.5rem] shadow-xl shrink-0">
                        <div className="flex justify-between items-center mb-6 pt-2">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-blue-700 flex items-center justify-center font-bold">DM</div>
                                <div className="text-left"><p className="text-blue-200 text-[10px] uppercase font-semibold">Res. El Parque</p><h1 className="text-lg font-bold">Deivis M.</h1></div>
                            </div>
                            <button onClick={() => setStep('settings')} className="bg-white/10 p-2 rounded-xl"><Icon name="settings" size={18} /></button>
                        </div>
                        <div className="bg-white/10 p-5 rounded-3xl backdrop-blur-lg border border-white/20">
                            <div className="flex justify-between items-start mb-1"><p className="text-blue-100 text-xs">Saldo Pendiente</p><span className="bg-amber-500 text-[9px] px-2 py-0.5 rounded-full font-black">ABRIL</span></div>
                            <div className="flex justify-between items-end">
                                <h2 className="text-3xl font-extrabold">Bs. 2.450,00</h2>
                                <button onClick={() => setStep('report')} className="bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-black shadow-lg">Pagar Ahora</button>
                            </div>
                        </div>
                    </div>
                    <div className="px-6 -mt-5 shrink-0">
                        <div className="bg-white rounded-3xl shadow-md p-4 flex justify-around border border-slate-100">
                            <div className="text-center">
                                <Icon name="shield-check" className="text-blue-600 mx-auto mb-1" />
                                <p className="text-slate-400 text-[9px] uppercase font-black">Fondo Reserva</p>
                                <p className="text-blue-900 font-black text-sm">$1.240</p>
                            </div>
                            <div className="text-center">
                                <Icon name="trending-up" className="text-emerald-600 mx-auto mb-1" />
                                <p className="text-slate-400 text-[9px] uppercase font-black">Tasa BCV</p>
                                <p className="text-slate-800 font-black text-sm">36.45</p>
                            </div>
                        </div>
                    </div>
                    <div className="px-6 mt-6 shrink-0">
                        <h3 className="text-slate-800 font-black text-xs uppercase mb-3 ml-1">Anuncios</h3>
                        <div className="space-y-3">
                            {notices.map(n => (
                                <button key={n.id} onClick={() => { setSelectedNotice(n); setStep('notice_detail'); }} className="w-full bg-white border p-4 rounded-2xl flex gap-4 items-center shadow-sm">
                                    <div className="bg-blue-50 p-3 rounded-xl text-blue-600"><Icon name={n.icon} size={16}/></div>
                                    <div className="flex-1 text-left"><h4 className="text-slate-800 text-xs font-black uppercase tracking-tight">{n.title}</h4><p className="text-slate-400 text-[10px]">{n.date}</p></div>
                                    <Icon name="chevron-right" size={14} className="text-slate-300" />
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const AdminDashboard = () => (
                <div className="flex flex-col h-full bg-slate-50 pb-24 overflow-y-auto no-scrollbar">
                    <div className="bg-slate-900 p-6 text-white rounded-b-[2.5rem] shadow-xl shrink-0">
                        <div className="flex justify-between items-center mb-6 pt-2">
                            <h1 className="text-lg font-black tracking-tight uppercase italic">Panel Administración</h1>
                            <button onClick={() => setStep('settings')} className="bg-white/10 p-2 rounded-xl"><Icon name="settings" size={18} /></button>
                        </div>
                        <div className="grid grid-cols-2 gap-3 mb-4">
                            <div className="bg-white/5 border border-white/10 p-4 rounded-3xl"><p className="text-slate-500 text-[10px] font-black mb-1 uppercase tracking-tighter">Por Conciliar</p><h2 className="text-2xl font-black text-amber-400 italic">12</h2></div>
                            <div className="bg-white/5 border border-white/10 p-4 rounded-3xl"><p className="text-slate-500 text-[10px] font-black mb-1 uppercase tracking-tighter">Morosidad</p><h2 className="text-2xl font-black text-rose-500 italic">18%</h2></div>
                        </div>
                        <div className="bg-blue-600/20 p-4 rounded-2xl border border-blue-500/20">
                            <div className="flex justify-between text-[10px] font-black uppercase mb-1"><span>Recaudación Mes</span><span>82%</span></div>
                            <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-blue-500 w-[82%]"></div></div>
                        </div>
                    </div>
                    <div className="p-6 space-y-4">
                        <h3 className="text-slate-800 font-black text-xs uppercase italic tracking-widest">Validación de Pagos</h3>
                        {[
                            { id: 1, unit: 'PH-A', name: 'Ricardo Gómez', amount: 'Bs. 4.500,00', ref: '#9982' },
                            { id: 2, unit: '4-B', name: 'Deivis Montenegro', amount: 'Bs. 2.450,00', ref: '#8842' },
                        ].map((item) => (
                            <div key={item.id} onClick={() => { setSelectedPayment(item); setStep('admin_detail'); }} className="bg-white p-5 rounded-[1.5rem] shadow-sm border border-slate-100 flex items-center justify-between active:scale-[0.98] transition-transform">
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center font-black text-xs text-slate-400">{item.unit}</div>
                                    <div><p className="text-slate-900 font-black text-xs uppercase italic">{item.name}</p><p className="text-slate-500 text-[10px] font-bold">{item.amount}</p></div>
                                </div>
                                <Icon name="chevron-right" size={18} className="text-slate-300" />
                            </div>
                        ))}
                    </div>
                </div>
            );

            const AdminMetrics = () => (
                <div className="flex flex-col h-full bg-slate-50 pb-24 overflow-y-auto no-scrollbar">
                    <div className="bg-slate-900 p-6 text-white rounded-b-[2.5rem] shadow-xl shrink-0">
                        <h2 className="text-xl font-black tracking-widest uppercase italic">Reporte Financiero</h2>
                    </div>
                    <div className="p-6 space-y-6">
                        <section className="bg-white p-5 rounded-[2rem] shadow-sm border">
                            <h3 className="text-slate-800 font-black text-[10px] uppercase mb-4 italic">Flujo de Caja (Bs.)</h3>
                            <div className="space-y-4">
                                <div><div className="flex justify-between text-[10px] font-black mb-1"><span>INGRESOS</span><span>85%</span></div><div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-emerald-500 w-[85%]"></div></div></div>
                                <div><div className="flex justify-between text-[10px] font-black mb-1"><span>EGRESOS</span><span>60%</span></div><div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-rose-500 w-[60%]"></div></div></div>
                            </div>
                        </section>
                        <section className="bg-gradient-to-br from-indigo-900 to-blue-900 p-6 rounded-[2.5rem] text-white">
                            <p className="text-[10px] font-black opacity-50 uppercase mb-1">Histórico Fondo Reserva</p>
                            <h4 className="text-2xl font-black italic">$4.820,00</h4>
                            <div className="flex gap-1 items-end h-12 mt-4">
                                {[20, 30, 25, 45, 60, 80, 100].map((h, i) => <div key={i} style={{ height: `${h}%` }} className="flex-1 bg-white/20 rounded-t-sm"></div>)}
                            </div>
                        </section>
                    </div>
                </div>
            );

            const AdminDetail = () => (
                <div className="flex flex-col h-full bg-white overflow-y-auto no-scrollbar">
                    <div className="p-6 border-b flex justify-between items-center bg-slate-50 sticky top-0">
                        <button onClick={() => setStep('dashboard')} className="text-slate-500 font-black text-[10px] uppercase tracking-widest italic">Cerrar</button>
                        <span className="text-slate-900 font-black text-xs italic uppercase tracking-[2px]">Detalle de Pago</span>
                        <div className="w-10"></div>
                    </div>
                    <div className="p-8 pb-10">
                        <div className="flex justify-between items-center mb-8">
                            <div><h2 className="text-3xl font-black text-slate-900 tracking-tighter italic">{selectedPayment?.unit}</h2><p className="text-blue-600 text-xs font-black uppercase">{selectedPayment?.name}</p></div>
                            <div className="bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-2xl text-[10px] font-black tracking-widest italic uppercase">Match 100%</div>
                        </div>
                        
                        <div className="space-y-4">
                            <div className="bg-slate-900 rounded-[2rem] p-6 text-white shadow-xl">
                                <p className="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Reporte Vecino (IA)</p>
                                <div className="space-y-3">
                                    <div className="flex justify-between border-b border-white/5 pb-2"><span className="text-slate-500 text-xs font-bold uppercase">Referencia</span><span className="font-black text-xs text-blue-400 italic">{selectedPayment?.ref}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500 text-xs font-bold uppercase">Monto</span><span className="font-black text-xs italic">{selectedPayment?.amount}</span></div>
                                </div>
                            </div>
                            
                            <div className="flex justify-center -my-3 relative z-10"><div className="bg-emerald-500 p-2 rounded-full border-4 border-white text-white"><Icon name="arrow-right-left" size={16} /></div></div>

                            <div className="bg-emerald-50 rounded-[2rem] p-6 border-2 border-emerald-100 shadow-inner">
                                <p className="text-[10px] font-black text-emerald-600 uppercase mb-4 tracking-widest italic">Validación Banco (API)</p>
                                <div className="space-y-3">
                                    <div className="flex justify-between border-b border-emerald-200/40 pb-2"><span className="text-emerald-900/60 text-xs font-bold uppercase">Ref. Bancaria</span><span className="font-black text-xs text-emerald-900">{selectedPayment?.ref}</span></div>
                                    <div className="flex justify-between border-b border-emerald-200/40 pb-2"><span className="text-emerald-900/60 text-xs font-bold uppercase">Monto Recibido</span><span className="font-black text-xs text-emerald-900">{selectedPayment?.amount}</span></div>
                                    <div className="flex justify-between"><span className="text-emerald-900/60 text-xs font-bold uppercase">Banco</span><span className="font-black text-xs text-emerald-900 italic">BANESCO</span></div>
                                </div>
                            </div>
                        </div>
                        <button onClick={() => setStep('dashboard')} className="w-full bg-emerald-600 text-white py-5 rounded-[2rem] font-black text-sm shadow-xl mt-8 uppercase tracking-[2px] italic">Confirmar Conciliación</button>
                    </div>
                </div>
            );

            const SettingsScreen = () => (
                <div className="h-full bg-white flex flex-col pb-20 overflow-y-auto no-scrollbar">
                    <div className="p-6 flex justify-between items-center border-b sticky top-0 bg-white/90 backdrop-blur-md z-10">
                        <button onClick={() => setStep('dashboard')} className="text-slate-500 font-black text-xs italic uppercase tracking-widest">Cerrar</button>
                        <h2 className="font-black text-[11px] uppercase tracking-[3px] italic ml-4">Ajustes</h2>
                        <button onClick={() => { setIsLoggedIn(false); setStep('auth_welcome'); }} className="bg-rose-50 text-rose-500 px-3 py-1.5 rounded-xl font-black text-[10px] uppercase">Salir</button>
                    </div>
                    <div className="p-6 space-y-6">
                        <section className="space-y-4">
                            <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-[2px] italic">Perfil</h3>
                            <div className="p-5 bg-slate-50 rounded-[1.5rem] border"><p className="text-[9px] text-slate-400 font-black uppercase mb-1">Nombre</p><p className="font-black text-slate-900 text-sm">Deivis Montenegro</p></div>
                        </section>
                        {role === 'inquilino' && (
                            <section className="space-y-4">
                                <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-[2px] italic">Métodos de Pago</h3>
                                <div className="bg-slate-900 text-white p-6 rounded-[2rem] shadow-xl">
                                    <div className="flex justify-between mb-4"><Icon name="wallet" className="opacity-50"/><span className="text-[10px] font-black opacity-30 uppercase tracking-widest">Pago Móvil</span></div>
                                    <p className="text-xl font-black tracking-[2px] italic">0414-2223344</p>
                                    <div className="flex gap-4 mt-4 opacity-60 text-[10px] font-black"><span>V-12.345.678</span><span>BANESCO</span></div>
                                </div>
                            </section>
                        )}
                    </div>
                </div>
            );

            // MAIN RENDERER
            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="w-[375px] h-[780px] bg-slate-900 rounded-[3.5rem] shadow-[0_50px_100px_-12px_rgba(0,0,0,0.5)] border-[10px] border-slate-900 relative overflow-hidden ring-4 ring-slate-800/30">
                        {/* Isla Dinámica */}
                        <div className="absolute top-2 left-1/2 -translate-x-1/2 w-28 h-7 bg-black rounded-full z-[100]"></div>
                        
                        <div className="h-full w-full bg-white relative overflow-hidden">
                            {!isLoggedIn ? (
                                <>
                                    {step === 'auth_welcome' && <AuthWelcome />}
                                    {step === 'login' && <Login />}
                                </>
                            ) : (
                                <>
                                    {step === 'dashboard' && (role === 'inquilino' ? <InquilinoDashboard /> : <AdminDashboard />)}
                                    {step === 'metrics' && <AdminMetrics />}
                                    {step === 'admin_detail' && <AdminDetail />}
                                    {step === 'settings' && <SettingsScreen />}
                                    {step === 'receipt_history' && <div className="h-full bg-slate-50 p-6"><button onClick={() => setStep('dashboard')} className="text-slate-400 font-black text-[10px] uppercase mb-8 self-start tracking-widest">← Volver</button><h2 className="font-black text-sm uppercase italic mb-6">Historial de Recibos</h2>{receipts.map(r => <div key={r.id} className="bg-white p-4 rounded-2xl mb-3 flex justify-between items-center shadow-sm border border-slate-100"><div><p className="font-black text-xs italic tracking-tight">{r.month}</p><p className="text-[10px] text-slate-400">{r.id}</p></div><Icon name="download" size={16} className="text-blue-900" /></div>)}</div>}
                                    {step === 'report' && <div className="h-full bg-white p-8 flex flex-col"><button onClick={() => setStep('dashboard')} className="text-blue-600 font-black text-[10px] uppercase mb-12 self-start tracking-widest">← Volver</button><h2 className="text-2xl font-black text-slate-900 mb-2 italic uppercase tracking-tighter">Reportar Pago</h2><div onClick={() => { setStep('scanning'); setTimeout(() => setStep('success'), 3000); }} className="flex-1 border-2 border-dashed border-blue-100 rounded-[3rem] bg-blue-50/50 flex flex-col items-center justify-center cursor-pointer"><div className="bg-blue-900 text-white p-6 rounded-full mb-4"><Icon name="camera" size={40} strokeWidth={2.5} /></div><p className="font-black text-blue-900 text-sm uppercase tracking-tight italic text-center px-6">Adjuntar captura de pago</p></div></div>}
                                    {step === 'scanning' && <div className="h-full bg-blue-900 flex flex-col items-center justify-center p-8 text-center text-white"><div className="w-52 h-72 border-4 border-blue-400/30 rounded-[2rem] relative overflow-hidden mb-12"><div className="absolute top-0 left-0 w-full h-1.5 bg-cyan-400 animate-scan-line shadow-[0_0_25px_#22d3ee]"></div><div className="absolute inset-0 flex items-center justify-center bg-blue-900/40"><div className="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div></div></div><h2 className="text-xl font-black italic tracking-widest uppercase italic">Validando...</h2></div>}
                                    {step === 'success' && <div className="h-full flex flex-col items-center justify-center p-8 text-center bg-white"><div className="bg-emerald-100 text-emerald-600 p-8 rounded-full mb-8"><Icon name="check-circle" size={80} strokeWidth={3} /></div><h2 className="text-3xl font-black text-slate-900 mb-10 tracking-tighter italic uppercase">¡Enviado!</h2><button onClick={() => setStep('dashboard')} className="w-full bg-blue-900 text-white py-5 rounded-[2rem] font-black text-lg shadow-xl uppercase italic">Entendido</button></div>}
                                    {step === 'notice_detail' && <div className="h-full bg-white p-8 flex flex-col"><button onClick={() => setStep('dashboard')} className="text-blue-600 font-black text-xs uppercase mb-8 self-start">← Cerrar</button><div className="bg-blue-50 p-4 rounded-[2rem] inline-block mb-6 w-fit"><Icon name={selectedNotice?.icon || 'info'} size={32} className="text-blue-600" /></div><h3 className="text-2xl font-black text-slate-900 mb-2 italic uppercase">{selectedNotice?.title}</h3><p className="text-slate-500 text-sm leading-relaxed bg-slate-50 p-6 rounded-[2rem] border">{selectedNotice?.desc}</p></div>}

                                    {/* Bottom Nav */}
                                    {(step === 'dashboard' || step === 'metrics' || step === 'receipt_history') && (
                                        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 w-[85%] bg-white/90 backdrop-blur-xl border h-14 rounded-2xl shadow-2xl flex justify-around items-center px-4 z-50">
                                            <button onClick={() => setStep('dashboard')} className={`flex flex-col items-center gap-0.5 ${step === 'dashboard' ? 'text-blue-900' : 'text-slate-300'}`}>
                                                <Icon name="layout-dashboard" size={18} strokeWidth={step === 'dashboard' ? 3 : 2} />
                                                <span className="text-[7px] font-black uppercase italic tracking-widest">Inicio</span>
                                            </button>
                                            <button 
                                                onClick={() => role === 'administrador' ? setStep('metrics') : setStep('receipt_history')} 
                                                className={`flex flex-col items-center gap-0.5 ${step === 'metrics' || step === 'receipt_history' ? 'text-blue-900' : 'text-slate-300'}`}
                                            >
                                                <Icon name={role === 'administrador' ? 'bar-chart-3' : 'file-text'} size={18} strokeWidth={step === 'metrics' || step === 'receipt_history' ? 3 : 2} />
                                                <span className="text-[7px] font-black uppercase italic tracking-widest">{role === 'administrador' ? 'Métricas' : 'Docs'}</span>
                                            </button>
                                            <button onClick={() => setStep('settings')} className={`flex flex-col items-center gap-0.5 ${step === 'settings' ? 'text-blue-900' : 'text-slate-300'}`}>
                                                <Icon name="user" size={18} />
                                                <span className="text-[7px] font-black uppercase italic tracking-widest">Perfil</span>
                                            </button>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
